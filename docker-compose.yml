services:
  backend:
    build: ./backend
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:80/"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 一次性验收服务：对 frontend/backend 做真实 HTTP 联调，成功退出 0 后容器结束
  verify:
    build: ./verify
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: "no"
